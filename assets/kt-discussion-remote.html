<!-- Host-selected remote transport for staging and production. -->
<script>
(() => {
  'use strict';
  const environment = location.hostname === 'killigans-treasure.carambi.com' ? 'production' : null;
  if (!environment) return;
  const meta = name => document.querySelector(`meta[name="${name}"]`)?.content ?? '';
  if (meta('kt-discussion-environment') !== environment) return;
  const origin = meta('kt-discussion-api');
  const turnstileSitekey = meta('kt-discussion-turnstile-sitekey');
  const expectedApiHost = `discussion${environment === 'staging' ? '-staging' : ''}.carambi.com`;
  if (origin !== `https://${expectedApiHost}` || !/^0x[A-Za-z0-9]+$/.test(turnstileSitekey)) return;
  const config = Object.freeze({ origin, turnstileSitekey });
  const endpoint = config.origin + '/v1/discussion';
  const legacyReactionTypes = ['like', 'heart', 'smile', 'celebrate', 'thinking'];
  function reactionTypesFor(input) {
    if (input.reactionVersion !== undefined && input.reactionVersion !== 1 && input.reactionVersion !== 2) throw Error('INVALID_REACTION_VERSION');
    return input.reactionVersion === 2 ? [...legacyReactionTypes, 'sad'] : legacyReactionTypes;
  }
  function reactionProtocol(input) {
    reactionTypesFor(input);
    return input.reactionVersion === undefined ? {} : { reactionVersion: input.reactionVersion };
  }
  const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
  const exactKeys = (value, keys) => value && typeof value === 'object' && !Array.isArray(value) &&
    Object.keys(value).length === keys.length && keys.every(key => Object.hasOwn(value, key));
  function validReaction(row, reactionTypes = legacyReactionTypes) {
    return exactKeys(row, ['commentId', 'counts', 'selected', 'canReact']) && uuid(row.commentId) &&
      exactKeys(row.counts, reactionTypes) && reactionTypes.every(type => Number.isSafeInteger(row.counts[type]) && row.counts[type] >= 0) &&
      Array.isArray(row.selected) && row.selected.length <= reactionTypes.length && new Set(row.selected).size === row.selected.length &&
      row.selected.every(type => reactionTypes.includes(type) && row.counts[type] > 0) && typeof row.canReact === 'boolean';
  }
  async function reactionRequest(path, payload) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15_000);
    try {
      let response;
      try { response = await fetch(endpoint + path, { method: 'POST', mode: 'cors', credentials: 'omit',
        signal: controller.signal, referrerPolicy: 'no-referrer', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }); }
      catch { const error = Error('REACTION_UNKNOWN'); error.outcomeUnknown = true; throw error; }
      let data;
      try { data = await response.json(); } catch { data = null; }
      if (response.status !== 200 || data?.ok !== true) {
        const error = Error('REACTION_FAILED'); error.status = response.status;
        error.code = typeof data?.code === 'string' ? data.code : null;
        error.outcomeUnknown = ![400, 401, 403, 404, 405, 409, 413, 415, 422, 423, 429].includes(response.status);
        throw error;
      }
      return data;
    } finally { clearTimeout(timer); }
  }
  const subscriptionStates = ['not_requested', 'verification_pending', 'verification_failed', 'verification_unknown', 'active', 'cancelled', 'expired'];
  const subscriptionCodes = ['SUBSCRIPTION_UNAVAILABLE', 'SUBSCRIPTION_EMAIL_INVALID', 'SUBSCRIPTION_EMAIL_FIXED', 'SUBSCRIPTION_RATE_LIMITED'];
  async function subscriptionRequest(input, statusOnly) {
    if (!uuid(input.commentId) || !/^[0-9a-f]{64}$/.test(input.subscriptionProof) ||
        typeof input.pageKey !== 'string' || !input.pageKey || !['zh-CN', 'en'].includes(input.locale)) throw Error('INVALID_SUBSCRIPTION_REQUEST');
    const payload = { commentId: input.commentId, pageKey: input.pageKey, locale: input.locale, subscriptionProof: input.subscriptionProof };
    if (!statusOnly) payload.email = input.email;
    const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15_000);
    try {
      let response, data;
      try {
        response = await fetch(config.origin + '/v1/email-subscriptions' + (statusOnly ? '/status' : ''), {
          method: 'POST', mode: 'cors', credentials: 'omit', redirect: 'error', signal: controller.signal, referrerPolicy: 'no-referrer',
          headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
        });
        data = await response.json();
      } catch { const error = Error('SUBSCRIPTION_UNKNOWN'); error.outcomeUnknown = true; throw error; }
      if (response.status !== 200 || data?.ok !== true) {
        const error = Error('SUBSCRIPTION_FAILED');
        error.code = response.status !== 200 && data?.ok === false && subscriptionCodes.includes(data.code) ? data.code : null;
        error.outcomeUnknown = !error.code; throw error;
      }
      const row = data.subscription;
      const keys = row && Object.keys(row);
      if (!row || !subscriptionStates.includes(row.state) || typeof row.mayRetry !== 'boolean' ||
          !keys.every(key => ['state', 'mayRetry', 'expiresAt'].includes(key)) ||
          (row.expiresAt !== undefined && (typeof row.expiresAt !== 'string' || !Number.isFinite(Date.parse(row.expiresAt)) || new Date(row.expiresAt).toISOString() !== row.expiresAt))) {
        const error = Error('SUBSCRIPTION_UNKNOWN'); error.outcomeUnknown = true; throw error;
      }
      return { ok: true, subscription: { state: row.state, mayRetry: row.mayRetry, ...(row.expiresAt === undefined ? {} : { expiresAt: row.expiresAt }) } };
    } finally { clearTimeout(timer); }
  }
  window.__ktDiscussionRemoteTransport = Object.freeze({
    reactionVersion: 2,
    turnstileSitekey: config.turnstileSitekey,
    async readDiscussion(request) {
      const url = new URL(endpoint);
      for (const key of ['pageKey', 'locale', 'guideVersion'])
        url.searchParams.set(key, request[key]);
      for (const key of ['cursor', 'limit', 'section'])
        if (request[key] !== null && request[key] !== undefined) url.searchParams.set(key, request[key]);
      const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit',
        referrerPolicy: 'no-referrer' });
      if (!response.ok) throw Error('DISCUSSION_READ_FAILED');
      return response.json();
    },
    async readSummary(request) {
      const url = new URL(endpoint + '/summary');
      for (const key of ['guideVersion', 'scope', 'locale', 'cursor', 'limit'])
        if (request[key] !== null && request[key] !== undefined && request[key] !== '') url.searchParams.set(key, request[key]);
      const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (!response.ok) throw Error('DISCUSSION_READ_FAILED');
      return response.json();
    },
    async readReactions(input) {
      if (!Array.isArray(input.commentIds) || input.commentIds.length < 1 || input.commentIds.length > 50 ||
          !input.commentIds.every(uuid) || new Set(input.commentIds).size !== input.commentIds.length ||
          (input.visitorId !== undefined && !/^[0-9a-f]{64}$/.test(input.visitorId))) throw Error('INVALID_REACTION_REQUEST');
      const payload = { ...reactionProtocol(input), pageKey: input.pageKey, locale: input.locale, commentIds: input.commentIds };
      if (input.visitorId !== undefined) payload.visitorId = input.visitorId;
      const data = await reactionRequest('/reactions/read', payload);
      if (!Array.isArray(data.reactions) || data.reactions.length !== input.commentIds.length ||
          !data.reactions.every(row => validReaction(row, reactionTypesFor(input)) && input.commentIds.includes(row.commentId)) ||
          new Set(data.reactions.map(row => row.commentId)).size !== data.reactions.length) throw Error('INVALID_REACTION_RESPONSE');
      return { ok: true, reactions: data.reactions };
    },
    async setReaction(input) {
      if (!uuid(input.commentId) || !reactionTypesFor(input).includes(input.type) || !['add', 'remove'].includes(input.intent) ||
          !/^[0-9a-f]{64}$/.test(input.visitorId)) throw Error('INVALID_REACTION_REQUEST');
      const payload = { ...reactionProtocol(input), pageKey: input.pageKey, locale: input.locale, commentId: input.commentId,
        type: input.type, visitorId: input.visitorId, intent: input.intent };
      const data = await reactionRequest('/reactions', payload);
      if (!validReaction(data.reaction, reactionTypesFor(input)) || data.reaction.commentId !== input.commentId) {
        const error = Error('INVALID_REACTION_RESPONSE'); error.outcomeUnknown = true; throw error;
      }
      return { ok: true, reaction: data.reaction };
    },
    async enrollSubscription(input) { return subscriptionRequest(input, false); },
    async readSubscriptionStatus(input) { return subscriptionRequest(input, true); },
    async postComment(input) {
      const payload = {
        schemaVersion: 1, pageKey: input.pageKey, locale: input.locale,
        guideVersion: input.guideVersion, displayName: input.displayName, body: input.body,
        pageHash: input.pageHash, parentCommentId: input.parentCommentId,
        replyToCommentId: input.replyToCommentId,
        turnstileToken: input.turnstileToken, honeypot: input.honeypot,
      };
      if (/^[0-9a-f]{64}$/.test(input.subscriptionProof)) payload.subscriptionProof = input.subscriptionProof;
      let response;
      try { response = await fetch(endpoint + '/comments', {
        method: 'POST', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
        ...(payload.subscriptionProof ? { redirect: 'error' } : {}),
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
      }); } catch {
        const error = Error('DISCUSSION_POST_UNKNOWN'); error.outcomeUnknown = true; throw error;
      }
      let data = null;
      try { data = await response.json(); } catch { /* HTTP status remains authoritative. */ }
      if (response.status === 201) return {
        ok: true, httpStatus: 201, commentId: typeof data?.commentId === 'string' ? data.commentId : null,
      };
      const error = Error('DISCUSSION_POST_FAILED');
      error.outcomeUnknown = ![400, 401, 403, 404, 405, 409, 413, 415, 422, 423, 429].includes(response.status);
      error.code = typeof data?.code === 'string' ? data.code : null;
      error.fieldErrors = data?.fieldErrors && typeof data.fieldErrors === 'object' ? data.fieldErrors : null;
      throw error;
    },
    async sendFeedback(input) {
      const payload = {
        schemaVersion: 1, category: input.category, message: input.message,
        contact: input.contact, guideVersion: input.guideVersion, locale: input.locale,
        pagePath: input.pagePath, pageHash: input.pageHash,
        viewportClass: input.viewportClass, relatedCommentId: input.relatedCommentId,
        turnstileToken: input.turnstileToken, honeypot: input.honeypot,
      };
      const response = await fetch(config.origin + '/v1/feedback', {
        method: 'POST', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
      });
      let data = null;
      try { data = await response.json(); } catch { /* HTTP status remains authoritative. */ }
      if (response.status === 202) return { ok: true, httpStatus: 202 };
      const error = Error('FEEDBACK_SEND_FAILED');
      error.code = typeof data?.code === 'string' ? data.code : null;
      error.fieldErrors = data?.fieldErrors && typeof data.fieldErrors === 'object' ? data.fieldErrors : null;
      throw error;
    },
  });
})();
</script>
